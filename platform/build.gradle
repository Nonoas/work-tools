plugins {
    id 'application'  // ← 在这里启用 application 插件
}

dependencies {
    // 这里放原来根项目的所有 dependencies
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    implementation 'org.quartz-scheduler:quartz:2.3.2'
    implementation 'com.melloware:jintellitype:1.4.0'
    implementation 'com.h2database:h2:2.2.220'
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.47'
    implementation 'org.freemarker:freemarker:2.3.30'
    implementation 'org.flywaydb:flyway-core:10.12.0'
    implementation 'cn.hutool:hutool-db:5.8.25'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'
    implementation 'io.github.nonoas:jfx-flat-ui:1.0.3'
    implementation 'io.github.mkpaz:atlantafx-base:2.0.1'
    implementation "org.openjfx:javafx-controls:${jfxVersion}"
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.yaml:snakeyaml:2.2'
}

application {
    mainClass = 'indi.nonoas.worktools.MainKt'
}

jar {
    manifest {
        attributes 'Main-Class': 'indi.nonoas.worktools.MainKt'
    }
}